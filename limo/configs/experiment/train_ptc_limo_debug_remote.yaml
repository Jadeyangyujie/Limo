# @package _global_

defaults:
  - override /dataset: limo_local_example
  - override /logger: wandb

tags: ["DEBUG", "ptc", "limo", "aug"]

trainer:
  accelerator: gpu
  devices: 1
  precision: 16-mixed
  max_epochs: 5
  log_every_n_steps: 10


dataset:
  dataset_folder: /dfs/data/limo_dataset
  missions_csv: ${paths.root_dir}/limo/configs/dataset/ptc_missions_split_debug.csv
  dataset_type: "aug"
  batch_size: 32
  num_workers: 4
  pin_memory: false


model:
  train_scalar_log_interval: 50
  wandb_num_images: 4
  wandb_train_log_interval: 8
  wandb_log_worst: true


ptc:
  enabled: true
  label_group: ptc_labels
  risk_key: risk_map
  valid_key: valid_mask
  allow_missing_labels: false
  validate_metadata: true
  allow_metadata_mismatch: false
  x_min: -4.0
  x_max: 4.0
  y_min: -4.0
  y_max: 4.0
  resolution: 0.04
  flip_x_axis: false
  flip_y_axis: false
  swap_xy: false
  lambda_risk: 0.03
  lambda_oor: 0.01
  lambda_invalid: 0.005
  lambda_smooth: 0.002
  oor_mode: relative
  # Positive safety_margin means pred must be safer than gt by this amount.
  safety_margin: 0.0
  valid_margin: 0.0
  sampling:
    coordinate: cell_center
    mode: bilinear
    align_corners: true

seed: 12345
